#================ SMARTPURGE CONFIGURATION FILE (v1.1.1) =====================
# Call this macro in each Filament (Material settings) configured in OrcaSlicer,
# in the TAB "Advanced", Filament start G-code section after "; Filament gcode" comment:
#
# ; Filament gcode
# {if layer_num >= 0}
#    PURGE_IN_TRASH
# {endif}
#
# Ensure that you include this config file in your printer.cfg with the following line:
# [include SmartPurge.cfg]
#

[gcode_macro PURGE_IN_TRASH]
description: Go to the trash, purge the old filament in safe chunks and clean the nozzle
variable_purge_x: -17          # X coordinate adjusted to your real coordinate
variable_purge_y: -20          # Y coordinate adjusted to your real coordinate
variable_wipe_dist: 20         # Wipe distance - move in X to wipe the nozzle on the brush
variable_z_hop: 3.0            # Temporary safety elevation
variable_skip_purge: 2.0       # Default minimum purge threshold in mm (overridden by ChromaSave)
variable_max_purge_chunk: 45.0 # Maximum extrusion per purge pulse in mm (Bambu A1 style)
variable_pulse_cool_fan: 255   # Fan PWM (0-255) during pause to solidify purge root (255=100%, 153=~60%)
variable_pulse_cool_ms: 2000   # Cooling pause duration in ms before wiping (2000 ms = 2s)
variable_filament_sensor: "filament_sensor" # Sensor name (leave "" to disable auto-suspension)
variable_aux_fan: ""           # Optional [fan_generic <name>] to pause & restore (e.g. "aux_fan")
gcode:
    # Dynamic filament purge quantity in mm, passed by ChromaSave
    {% set QTY = params.QUANTITY|default(0)|float %}
    {% set OBS = params.OBS|default("No OBS") %}
    {% set MATERIAL = params.MATERIAL|default('UNK')|string|upper %}
    {% set DEFAULT_SKIP = printer["gcode_macro PURGE_IN_TRASH"].skip_purge|float %}
    {% set SKIP_PURGE = params.SKIP_THRESHOLD|default(params.SKIP_PURGE|default(DEFAULT_SKIP))|float %}
    {% set MAX_CHUNK = printer["gcode_macro PURGE_IN_TRASH"].max_purge_chunk|float %}
    {% set PULSE_COOL_FAN = printer["gcode_macro PURGE_IN_TRASH"].pulse_cool_fan|int %}
    {% set PULSE_COOL_MS = printer["gcode_macro PURGE_IN_TRASH"].pulse_cool_ms|int %}
    {% set AUX_FAN = printer["gcode_macro PURGE_IN_TRASH"].aux_fan|string %}

    {% if QTY >= SKIP_PURGE and QTY > 0 %}
        # 1. Trash Parameters & Fan State Capture
        {% set PURGE_X = printer["gcode_macro PURGE_IN_TRASH"].purge_x|float %}
        {% set Z_HOP = printer["gcode_macro PURGE_IN_TRASH"].z_hop|float %}
        {% set layer_fan_speed = printer.fan.speed %}
        {% set has_aux_fan = (AUX_FAN != "") and (('fan_generic ' ~ AUX_FAN) in printer) %}
        {% set aux_fan_speed = printer['fan_generic ' ~ AUX_FAN].speed if has_aux_fan else 0.0 %}

        # Determine base fan speed during extrusion (low/off for clean flow before solidification pulse)
        {% if MATERIAL in ['UNK', 'ABS', 'ASA', 'NYLON', 'PC', 'PA6', 'PA612', 'PA12'] %}
            {% set PURGE_FAN = (layer_fan_speed * 255)|int %}
        {% elif MATERIAL in ['PETG', 'TPU'] %}
            {% set PURGE_FAN = 102 %}
        {% else %}
            {% set PURGE_FAN = 255 %}
        {% endif %}

        # 2. Save current state and enforce relative extrusion
        SAVE_GCODE_STATE NAME=purge_state
        M83
        {% if has_aux_fan %}
            SET_FAN_SPEED FAN={AUX_FAN} SPEED=0
        {% endif %}

        {action_respond_info(OBS)}

        # 3. Initial safety movement (Avoids colliding with the piece)
        G91                           ; Relative positioning temporary
        G1 Z{Z_HOP} F2100             ; Lift Z slightly for safety
        
        # 4. Travel quickly to the trash
        G90                           ; Absolute positioning
        G1 X{PURGE_X} F12000

        # 5. Pulsed Purge Process (Max 45mm per chunk + Solidification Cooling Pulse + WIPING_CYCLE)
        {% set NUM_CHUNKS = (QTY // MAX_CHUNK)|int + (1 if (QTY % MAX_CHUNK) > 0.001 else 0) %}
        {% set NUM_CHUNKS = 1 if NUM_CHUNKS < 1 else NUM_CHUNKS %}
        {% set CHUNK_LEN = QTY / NUM_CHUNKS %}

        {% for i in range(NUM_CHUNKS) %}
            {action_respond_info("ChromaSave Purge Pulse %d/%d: %.2f mm" % (i + 1, NUM_CHUNKS, CHUNK_LEN))}
            M106 S{PURGE_FAN}             ; Base fan speed while extruding
            G92 E0                        ; Reset extruder counter
            {% if i > 0 %}
                G1 E2.0 F1800             ; Recover 2mm retraction from previous pulse
                G92 E0
            {% endif %}
            G1 E{CHUNK_LEN} F300          ; Extrude chunk slowly
            G1 E-2.0 F1800                ; Retract immediately to stop oozing
            M106 S{PULSE_COOL_FAN}        ; Cool burst to solidify purge root
            G4 P{PULSE_COOL_MS}           ; Wait for filament to harden & drop cleanly
            WIPING_CYCLE                  ; Wipe nozzle on brush and return to PURGE_X
        {% endfor %}

        # 6. Restore layer & auxiliary fan speeds BEFORE moving back over the part
        M106 S{(layer_fan_speed * 255)|int}
        {% if has_aux_fan %}
            SET_FAN_SPEED FAN={AUX_FAN} SPEED={aux_fan_speed}
        {% endif %}

        # 7. Restore original state and position
        RESTORE_GCODE_STATE NAME=purge_state MOVE=1 MOVE_SPEED=200

    {% else %}
        {action_respond_info(OBS)}
        {action_respond_info("ChromaSave SKIP PURGE: %.2f mm < %.2f mm threshold." % (QTY, SKIP_PURGE))}
    {% endif %}


[gcode_macro WIPING_CYCLE]
description: Wiping cycle to clean the nozzle on the brush.
gcode:
    {% set PURGE_X = printer["gcode_macro PURGE_IN_TRASH"].purge_x|float %}
    {% set WIPE_DIST = printer["gcode_macro PURGE_IN_TRASH"].wipe_dist|float %}
    {% set x_position = printer.gcode_move.gcode_position[0]|float %}

    {% if x_position >= PURGE_X-0.05 and x_position <= PURGE_X+0.05 %}
        RESPOND MSG="The nozzle already in X={PURGE_X}"
    {% else %}
        RESPOND MSG="Nozzle in (X={x_position}). Moving to X={PURGE_X} for wiping cycle."
        G90                     ; Absolute mode
        G1 X{PURGE_X} F12000    ; Moving to X={PURGE_X} (200 mm/s)
    {% endif %}

    # Wiping cycle on the brush
    G90
    G1 X{PURGE_X + WIPE_DIST} F12000  ; Move quickly in X to wipe the nozzle on the brush
    G1 X{PURGE_X} F12000              ; Return movement in X
    M400
    G92 E0                            ; Reset the extruder counter


[gcode_macro FILAMENT_CHANGE]
description: Change filament dynamically adjusting speeds, sensor safety, and pre-cut retraction for ChromaSave.
gcode:
    {% set LAYER_NUM = params.LAYER_NUM|int %}
    {% set NEXT_EXTRUDER = params.NEXT_EXTRUDER|int %}
    {% set MATERIAL = params.MATERIAL|default('UNK')|string|upper %}
    {% set RETRACT_BEFORE_CUT = params.RETRACT_BEFORE_CUT|default(0.0)|float %}

    {% set PURGE_X = printer["gcode_macro PURGE_IN_TRASH"].purge_x|float %}
    {% set Z_HOP = printer["gcode_macro PURGE_IN_TRASH"].z_hop|float %}
    {% set PULSE_COOL_FAN = printer["gcode_macro PURGE_IN_TRASH"].pulse_cool_fan|int %}
    {% set PULSE_COOL_MS = printer["gcode_macro PURGE_IN_TRASH"].pulse_cool_ms|int %}
    {% set SENSOR_NAME = printer["gcode_macro PURGE_IN_TRASH"].filament_sensor|string %}
    {% set AUX_FAN = printer["gcode_macro PURGE_IN_TRASH"].aux_fan|string %}

    {% set has_sensor = (SENSOR_NAME != "") and (('filament_switch_sensor ' ~ SENSOR_NAME) in printer or ('filament_motion_sensor ' ~ SENSOR_NAME) in printer) %}
    {% set has_aux_fan = (AUX_FAN != "") and (('fan_generic ' ~ AUX_FAN) in printer) %}
    {% set layer_fan_speed = printer.fan.speed %}
    {% set aux_fan_speed = printer['fan_generic ' ~ AUX_FAN].speed if has_aux_fan else 0.0 %}

    # KINEMATIC MATRIX BASED ON MATERIAL RHEOLOGY
    {% if 'TPU' in MATERIAL %}
        {% set V_RETRACT = 900 %}    # 15 mm/s (Avoid elastic stretching)
        {% set V_UNLOAD = 1200 %}    # 20 mm/s (Prevents gear jams)
        {% set V_LOAD = 600 %}       # 10 mm/s (Slow loading to prevent buckling)
        {% set V_COMPACT = 300 %}    # 5 mm/s (Gentle compaction)
    {% else %}
        {% set V_RETRACT = 2400 %}   # 40 mm/s (Safe thermal cutoff; V_RETRACT/2 = 20 mm/s)
        {% set V_UNLOAD = 1200 %}    # 20 mm/s (Controlled unloading to prevent gear slip)
        {% set V_LOAD = 1200 %}      # 20 mm/s (Nominal load)
        {% set V_COMPACT = 1200 %}   # 20 mm/s (Purge compaction)
    {% endif %}

    {% if LAYER_NUM != -1 %}
        SAVE_GCODE_STATE NAME=change_state
        M83
        {% if has_aux_fan %}
            SET_FAN_SPEED FAN={AUX_FAN} SPEED=0
        {% endif %}

        # Safety retraction and lifting
        G91
        G1 E-2.0 F{V_RETRACT}
        G1 Z{Z_HOP} F2100
        
        # Travel quickly to the trash
        G90
        G1 X{PURGE_X} F12000
        {% if has_sensor %}
            SET_FILAMENT_SENSOR SENSOR={SENSOR_NAME} ENABLE=0
        {% endif %}
        M400

        # ChromaSave Dynamic Pre-Cut Retraction (Pulls remaining gap above cutter blade)
        {% if RETRACT_BEFORE_CUT > 0 %}
            {action_respond_info("ChromaSave Pre-Cut Retraction: -%.2f mm" % RETRACT_BEFORE_CUT)}
            G91
            G1 E-{RETRACT_BEFORE_CUT} F{V_RETRACT}
            G90
            M400
        {% endif %}
        
        # Filament cut
        FILAMENT_CUT
        
        # Unloading Sequence (old filament removal)
        G91
        G4 P300
        G1 X20 E-20 F{V_RETRACT/2}
        G1 X-20 E-20 F{V_RETRACT/2}
        G1 X-8 E-20 F{V_UNLOAD}
        G1 X28 E-20 F{V_UNLOAD}
        G1 X-20 E-20 F{V_UNLOAD}

        # Filament Change
        T{NEXT_EXTRUDER}

        # Loading Sequence (New filament load)
        G1 X-8 E20 F{V_LOAD}
        G1 X28 E20 F{V_LOAD}
        G1 X-20 E20 F{V_LOAD}

        M400
        {% if has_sensor %}
            SET_FILAMENT_SENSOR SENSOR={SENSOR_NAME} ENABLE=1
        {% endif %}

        # Final compaction
        G1 X-8 E20 F{V_LOAD}
        G1 X8 E20 F{V_LOAD}
        M400
        G1 E1 F{V_COMPACT}

        # ChromaSave Post-Load Recovery (Pushes remaining stub back to nozzle tip)
        {% if RETRACT_BEFORE_CUT > 0 %}
            {action_respond_info("ChromaSave Post-Load Recovery: +%.2f mm" % RETRACT_BEFORE_CUT)}
            G1 E{RETRACT_BEFORE_CUT} F300
            M400
        {% endif %}

        # Solidification cooling pulse before wiping
        M106 S{PULSE_COOL_FAN}
        G4 P{PULSE_COOL_MS}
        
        WIPING_CYCLE
        M400

        # Restore fans BEFORE returning over the part
        M106 S{(layer_fan_speed * 255)|int}
        {% if has_aux_fan %}
            SET_FAN_SPEED FAN={AUX_FAN} SPEED={aux_fan_speed}
        {% endif %}

        # Return and pressurization
        RESTORE_GCODE_STATE NAME=change_state MOVE=1 MOVE_SPEED=200
        G91
        M83
        G1 E2.5 F{V_RETRACT/2}
        G90
        G92 E0
    {% endif %}


# ==============================================================================
# OPTIONAL TEMPLATE: Generic Klipper Perpendicular Pre-Cut Staging (FILAMENT_CUT)
# Uncomment and adjust coordinates ONLY if your printer does not already define
# FILAMENT_CUT (e.g., CoPrint users already have FILAMENT_CUT in cp_macro.cfg).
# Staging at pre_cut_pos before pressing cut_pos ensures a perpendicular cut.
# ==============================================================================
# [gcode_macro FILAMENT_CUT]
# variable_pre_cut_x: 10.0
# variable_cut_x: -5.0
# variable_cut_y: 200.0
# variable_approach_speed: 12000
# variable_cut_speed: 1800
# gcode:
#     G90
#     G1 X{pre_cut_x} Y{cut_y} F{approach_speed} ; Stage perpendicular to cutter
#     G1 X{cut_x} F{cut_speed}                   ; Press cutter blade cleanly
#     G4 P200                                    ; Brief dwell to complete cut
#     G1 X{pre_cut_x} F{approach_speed}          ; Release cutter arm