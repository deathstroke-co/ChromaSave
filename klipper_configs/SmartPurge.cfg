#================ SMARTPURGE CONFIGURATION FILE =====================
#Call this macro in each Filament (Material settings) configured in OrcaSlicer,
#in the TAB "Advanced", Filament start G-code section after "; Filament gcode" comment:
#
#; Filament gcode
#{if layer_num >= 0}
#   PURGE_IN_TRASH
#{endif}
#
# Asure that you include this config file in your printer.cfg with the following line:
#[include SmartPurge.cfg]
#
# In OrcaSlicer, go to printer settings, Machine G-code tab, Change filament G-code and replace the command for:
# 
# FILAMENT_CHANGE LAYER_NUM=[layer_num] NEXT_EXTRUDER=[next_extruder] MATERIAL=[filament_type]
#


[gcode_macro PURGE_IN_TRASH]
description: Go to the trash, purge the old filament and clean the nozzle
variable_purge_x: -16 # X coordinate adjusted to your real coordinate
variable_purge_y: -20 # Y coordinate adjusted to your real coordinate
variable_wipe_dist: 15 # Wipe distance - move in X to wipe the nozzle on the brush (adjust to your real coordinate)
variable_z_hop: 3.0 # Temporary safety elevation
gcode:

	# Dinamic filament purge quantity in mm (default 65mm), passed by ChromaSave.
    {% set QTY = params.QUANTITY|default(0)|float %}  # ChromaHead Nozzle volume (156mm3) = 64.857mm of filament for 1.75mm diameter.
    {% set OBS = params.OBS|default("No OBS") %}  # Observation text passed by ChromaSave.
	{% set MATERIAL = params.MATERIAL|default('UNK')|string|upper %}
   
    {% if QTY > 2 %} # Set a minimum purge quantity to avoid unnecessary purges - Adjust this value to your needs.
        # 1. Trash Parameters
		{% set PURGE_X = printer["gcode_macro PURGE_IN_TRASH"].purge_x|float %}     
        {% set PURGE_Y = printer["gcode_macro PURGE_IN_TRASH"].purge_y|float %}       # Y coordinate adjusted to your real coordinate
        {% set WIPE_DIST = printer["gcode_macro PURGE_IN_TRASH"].wipe_dist|float %}    # Wipe distance - move in X to wipe the nozzle on the brush
        {% set Z_HOP = printer["gcode_macro PURGE_IN_TRASH"].z_hop|float %}         # Temporary safety elevation
		{% set layer_fan_speed = printer.fan.speed %} #store de current layer fan speed

        # 2. Save current state (coordinates, relative/absolute mode and extruder)
        SAVE_GCODE_STATE NAME=purge_state

        {action_respond_info(params.OBS)}

        # 3. Initial safety movement (Avoids colliding with the piece)
        G91                           ; Relative mode temporary
        G1 E-1.0 F3600                ; Light retraction anti-drip
        G1 Z{Z_HOP} F2100             ; Sube Z ligeramente por seguridad
        
        # 4. Travel quickly to the trash
        G90                           ; Absolute mode
        # G1 X{PURGE_X} Y{PURGE_Y} F12000
        G1 X{PURGE_X} F12000
		# 5. Layer Fan Speed for purge
		{% if MATERIAL in ['UNK', 'ABS', 'ASA', 'NYLON', 'PC', 'PA6', 'PA612'] %}
        	# Technical Materials: Gcode fan speed
        	M106 S{(layer_fan_speed * 255)|int} 
    	{% elif MATERIAL in ['PETG', 'TPU'] %}
        	# Intermediate Materials: Fan Speed 40%
        	M106 S102
    	{% else %}
        	# Others (PLA, Silk, Wood, etc.): Fan Speed 100%
        	M106 S255
    	{% endif %}

        # 6. Strong Purge Process
        G92 E0                        ; Reset the extruder counter
        G1 E{QTY} F300                ; Extrude variable amount of mm slowly to clean old color
        G4 P2000                      ; Wait 2 seconds for the filament to drop
        G1 E-1.0 F1800                ; Light retraction before moving the head

        # 7. Wiping cycle (Wipe) on the brush
		WIPING_CYCLE

        # 8. Restore the original state (Keeps the nozzle physically in the trash)
        RESTORE_GCODE_STATE NAME=purge_state MOVE=1

		# 9. Restore layer fan speed
		M106 S{(layer_fan_speed * 255)|int}   

    {% else %}
        
        {action_respond_info("Purge quantity too low, skipping purge.")}
    
    {% endif %}



[gcode_macro WIPING_CYCLE]
description: Wiping cycle to clean the nozzle on the brush.
gcode:

    {% set PURGE_X = printer["gcode_macro PURGE_IN_TRASH"].purge_x|float %}
	{% set WIPE_DIST = printer["gcode_macro PURGE_IN_TRASH"].wipe_dist|float %}
	{% set x_position = printer.gcode_move.gcode_position[0]|float %}

	{% if x_position >= PURGE_X-0.05 and x_position <= PURGE_X+0.05 %}
        RESPOND MSG="The nozzle already in X={PURGE_X}"
    {% else %}
        RESPOND MSG="Nozzle in (X={x_position}). Moving to X={PURGE_X} for wiping cycle."
        G90             # Absolute mode
        G1 X{PURGE_X} F12000   # Moving to X={PURGE_X} (200 mm/s)
    {% endif %}

    # 2. Wiping cycle (Wipe) on the brush
	G90
    G1 X{PURGE_X + WIPE_DIST} F12000  ; Move quickly in X to wipe the nozzle on the brush
    G1 X{PURGE_X} F12000              ; Return movement in X.
    G92 E0                        ; Reset the extruder counter


[gcode_macro FILAMENT_CHANGE]
description: Change filament dynamically adjusting speeds for flexible materials.
gcode:
    {% set LAYER_NUM = params.LAYER_NUM|int %}
    {% set NEXT_EXTRUDER = params.NEXT_EXTRUDER|int %}
    {% set MATERIAL = params.MATERIAL|default('UNK')|string|upper %}

    {% set PURGE_X = printer["gcode_macro PURGE_IN_TRASH"].purge_x|float %}
    {% set Z_HOP = printer["gcode_macro PURGE_IN_TRASH"].z_hop|float %}
    {% set FEEDRATE = printer.gcode_move.speed|float %}

    # KINEMATIC MATRIX BASED ON MATERIAL RHEOLOGY
    {% if 'TPU' in MATERIAL %}
        {% set V_RETRACT = 900 %}    # 15 mm/s (Avoid elastic stretching)
        {% set V_UNLOAD = 1200 %}    # 20 mm/s (Prevents gear jams)
        {% set V_LOAD = 600 %}       # 10 mm/s (Slow loading to prevent buckling)
        {% set V_COMPACT = 300 %}    # 5 mm/s (Gentle compaction)
    {% else %}
        {% set V_RETRACT = 1800 %}   # 30 mm/s (Abrupt thermal cutoff)
        {% set V_UNLOAD = 2400 %}    # 40 mm/s (Rapid multi-material unloading)
        {% set V_LOAD = 1200 %}      # 20 mm/s (Nominal load)
        {% set V_COMPACT = 1200 %}   # 20 mm/s (Purge compaction)
    {% endif %}

    {% if LAYER_NUM != -1 %}
        SAVE_GCODE_STATE NAME=change_state

        # Safety retraction and lifting
        G91
        G1 E-1.0 F{V_RETRACT}
        G1 Z{Z_HOP} F2100
        
        # Travel quickly to the trash
        G90
        G1 X{PURGE_X} F12000
        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
        M400
        
        # Filament cut
        FILAMENT_CUT
        
        # Unloading Sequence (old filament removal)
        G91
        G4 P300
        G1 X20 E-20 F{V_RETRACT}
        G1 X-20 E-20 F{V_RETRACT}
        G1 X-8 E-20 F{V_UNLOAD}
        G1 X28 E-20 F{V_UNLOAD}
        G1 X-20 E-20 F{V_UNLOAD}

        # Filament Change
        T{NEXT_EXTRUDER}

        # Loading Sequence (New filament load)
        G1 X-8 E20 F{V_LOAD}
        G1 X28 E20 F{V_LOAD}
        G1 X-20 E20 F{V_LOAD}

        M400
        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1

        # Final compatation
        G1 X-8 E20 F{V_LOAD}
        G1 X8 E20 F{V_LOAD}
        M400
        G1 E3 F{V_COMPACT} # wuth 3mm ok
        G4 P2000
        
        # Post-purge retraction
        G1 E-0.2 F{V_RETRACT}
        
        WIPING_CYCLE
        M400

        # Return and pressurization (Retraction)
        RESTORE_GCODE_STATE NAME=change_state MOVE=1 MOVE_SPEED=200
        G91
        G1 E1.5 F{FEEDRATE}  ; Recover 2 mm of retraction, while maintaining the print speed.
        G90
        G92 E0
  {% endif %}
