#================ SMARTPURGE K2 SERIES (CFS) CONFIGURATION (v1.2.0-beta) =====================
# Designed for Creality K2 Plus / K2 Series with CFS (Creality Filament System).
# Decouples Early-Cut filament swaps from dynamic chute purging using native [box] commands.
# INSTALLATION:
# 1. Copy this file to your K2 Plus Klipper config directory (e.g., /usr/data/printer_data/config/).
# 2. Include it in your printer.cfg:
# [include SmartPurge_K2.cfg]
# 3. Verify variable_tnn_map below matches your CFS spool slot assignment (T0 -> T1A, etc.).
# NOTE:
# - Do NOT call these macros manually in OrcaSlicer; ChromaSave automatically injects
# SMARTPURGE_K2_CUT (at the Early-Cut point) and SMARTPURGE_K2_FLUSH (at the chute point)
# when Creality K2 is detected in the sliced G-code.
# =============================================================================================

[gcode_macro SMARTPURGE_K2_CONFIG]
description: Central configuration variables for ChromaSave on Creality K2 Series (CFS)
# Maps OrcaSlicer tool index (T0, T1, T2, ...) to physical CFS slots (Unit 1..4, Slots A..D).
# Adjust this list if your slicer tool order differs from the default sequential CFS mapping.
variable_tnn_map: ['T1A', 'T1B', 'T1C', 'T1D', 'T2A', 'T2B', 'T2C', 'T2D', 'T3A', 'T3B', 'T3C', 'T3D', 'T4A', 'T4B', 'T4C', 'T4D']
#Safety & Motion Parameters
variable_z_hop: 3.0                  # Temporary Z lift (mm) before leaving the print
variable_return_speed: 250           # Return travel speed (mm/s) for RESTORE_GCODE_STATE
variable_filament_sensor: "filament_sensor"  # Runout sensor suspended during Early-Cut
# Purge & Cooling Parameters
variable_skip_purge: 2.0             # Default minimum purge threshold in mm (overridden by ChromaSave)
variable_max_purge_chunk: 45.0       # Max extrusion per flush pulse in mm to prevent chute clogs
variable_flush_velocity: 360         # Extrusion speed (mm/min) passed to BOX_MATERIAL_FLUSH
variable_max_flush_temp: 300.0       # Hard ceiling for BOX_MATERIAL_FLUSH (prevents firmware >300C error)
variable_pulse_cool_fan: 255         # Part fan PWM (0-255) during post-flush solidification pause
variable_pulse_cool_ms: 2000         # Solidification pause duration (ms) before BOX_NOZZLE_CLEAN
gcode:
    {action_respond_info("ChromaSave K2 CFS Config Loaded | TNN Map: %s" % (tnn_map|string))}

[gcode_macro SMARTPURGE_K2_CUT]
description: ChromaSave Early-Cut & CFS filament swap WITHOUT purging (preserves hotend melt zone)
gcode:
    {% set cfg = printer["gcode_macro SMARTPURGE_K2_CONFIG"] %}
    {% set NEXT_EXTRUDER = params.NEXT_EXTRUDER|default(0)|int %}
    {% set MATERIAL = params.MATERIAL|default('UNK')|string|upper %}
    {% set RETRACT_BEFORE_CUT = params.RETRACT_BEFORE_CUT|default(0.0)|float %}
    {% set TNN_MAP = cfg.tnn_map %}
    {% set DEFAULT_TNN = TNN_MAP[NEXT_EXTRUDER] if (NEXT_EXTRUDER >= 0 and NEXT_EXTRUDER < (TNN_MAP|length)) else 'T1A' %}
    {% set TNN = params.TNN|default(DEFAULT_TNN)|string|upper %}

    {% set Z_HOP = cfg.z_hop|float %}
    {% set RETURN_SPEED = cfg.return_speed|float %}
    {% set SENSOR_NAME = cfg.filament_sensor|string %}

    # Detect K2 output_pin fans & filament sensor safely
    {% set has_fan0 = ('output_pin fan0' in printer) %}
    {% set has_fan2 = ('output_pin fan2' in printer) %}
    {% set fan0_val = (printer['output_pin fan0'].value * 255.0)|int if has_fan0 else 0 %}
    {% set fan2_val = (printer['output_pin fan2'].value * 255.0)|int if has_fan2 else 0 %}
    {% set has_sensor = (SENSOR_NAME != "") and (('filament_switch_sensor ' ~ SENSOR_NAME) in printer or ('filament_motion_sensor ' ~ SENSOR_NAME) in printer) %}

    # Material-aware retraction speed (mm/min)
    {% if 'TPU' in MATERIAL %}
        {% set V_RETRACT = 900 %}
    {% else %}
        {% set V_RETRACT = 2400 %}
    {% endif %}

    {action_respond_info("ChromaSave K2 Early-Cut: Loading T%d -> CFS Slot %s (PreCutRet: %.2f mm)" % (NEXT_EXTRUDER, TNN, RETRACT_BEFORE_CUT))}

    # 1. Save state, enforce relative extrusion, and pause fans
    SAVE_GCODE_STATE NAME=k2_cut_state
    M83
    {% if has_fan0 %}
        SET_PIN PIN=fan0 VALUE=0
    {% endif %}
    {% if has_fan2 %}
        SET_PIN PIN=fan2 VALUE=0
    {% endif %}

    # 2. Initial safety retract and Z-hop away from print
    G91
    G1 E-2.0 F{V_RETRACT}
    G1 Z{Z_HOP} F2100
    G90
    M400

    # 3. Suspend filament_sensor (prevents false runout pause + 30mm refill extrusion)
    {% if has_sensor %}
        SET_FILAMENT_SENSOR SENSOR={SENSOR_NAME} ENABLE=0
    {% endif %}

    # 4. ChromaSave Dynamic Pre-Cut Retraction (pulls remaining gap above cutter blade)
    {% if RETRACT_BEFORE_CUT > 0.0 %}
        {action_respond_info("ChromaSave K2 Pre-Cut Retraction: -%.2f mm" % RETRACT_BEFORE_CUT)}
        G91
        G1 E-{RETRACT_BEFORE_CUT} F{V_RETRACT}
        G90
        M400
    {% endif %}

    # 5. Granular CFS Swap Sequence (Cut -> Retrude -> Load new spool to extruder, NO FLUSH)
    BOX_CUT_MATERIAL
    M400
    BOX_RETRUDE_MATERIAL
    M400
    BOX_EXTRUDE_MATERIAL TNN={TNN}
    M400
    BOX_EXTRUDER_EXTRUDE TNN={TNN}
    M400

    # 6. ChromaSave Post-Load Recovery (pushes remaining stub back to nozzle tip)
    {% if RETRACT_BEFORE_CUT > 0.0 %}
        {action_respond_info("ChromaSave K2 Post-Load Recovery: +%.2f mm" % RETRACT_BEFORE_CUT)}
        G91
        G1 E{RETRACT_BEFORE_CUT} F360
        G90
        M400
    {% endif %}

    # 7. Re-enable filament_sensor and clear chute/cutter zone safely
    {% if has_sensor %}
        SET_FILAMENT_SENSOR SENSOR={SENSOR_NAME} ENABLE=1
    {% endif %}
    BOX_MOVE_TO_SAFE_POS
    M400

    # 8. Restore fans BEFORE returning over the part
    {% if has_fan0 %}
        SET_PIN PIN=fan0 VALUE={fan0_val}
    {% endif %}
    {% if has_fan2 %}
        SET_PIN PIN=fan2 VALUE={fan2_val}
    {% endif %}

    # 9. Return to exact print position and re-pressurize nozzle
    RESTORE_GCODE_STATE NAME=k2_cut_state MOVE=1 MOVE_SPEED={RETURN_SPEED}
    G91
    M83
    G1 E2.0 F{V_RETRACT}
    G90
    G92 E0


[gcode_macro SMARTPURGE_K2_FLUSH]
description: ChromaSave dynamic chute purge on Creality K2 Series (CFS) using BOX_MATERIAL_FLUSH
gcode:
    {% set cfg = printer["gcode_macro SMARTPURGE_K2_CONFIG"] %}
    {% set QTY = params.QUANTITY|default(0.0)|float %}
    {% set OBS = params.OBS|default("No OBS") %}
    {% set DEFAULT_SKIP = cfg.skip_purge|float %}
    {% set SKIP_PURGE = params.SKIP_THRESHOLD|default(DEFAULT_SKIP)|float %}
    {% set MAX_CHUNK = cfg.max_purge_chunk|float %}
    {% set FLUSH_VEL = cfg.flush_velocity|int %}
    {% set MAX_TEMP = cfg.max_flush_temp|float %}
    {% set PULSE_COOL_FAN = cfg.pulse_cool_fan|int %}
    {% set PULSE_COOL_MS = cfg.pulse_cool_ms|int %}
    {% set Z_HOP = cfg.z_hop|float %}
    {% set RETURN_SPEED = cfg.return_speed|float %}

    # Resolve target temperature and enforce <= 300C ceiling (box_wrapper safety limit)
    {% set CUR_TARGET = printer.extruder.target|float %}
    {% set RAW_TEMP = params.TEMP|default(CUR_TARGET)|float %}
    {% set BASE_TEMP = RAW_TEMP if RAW_TEMP >= 170.0 else (CUR_TARGET if CUR_TARGET >= 170.0 else 220.0) %}
    {% set SAFE_TEMP = MAX_TEMP if BASE_TEMP > MAX_TEMP else BASE_TEMP %}

    {action_respond_info(OBS)}

    {% if QTY >= SKIP_PURGE and QTY > 0.0 %}
        # 1. Capture fan states
        {% set has_fan0 = ('output_pin fan0' in printer) %}
        {% set has_fan2 = ('output_pin fan2' in printer) %}
        {% set fan0_val = (printer['output_pin fan0'].value * 255.0)|int if has_fan0 else 0 %}
        {% set fan2_val = (printer['output_pin fan2'].value * 255.0)|int if has_fan2 else 0 %}

        # 2. Save state, lift Z safely, and move to chute
        SAVE_GCODE_STATE NAME=k2_flush_state
        M83
        {% if has_fan2 %}
            SET_PIN PIN=fan2 VALUE=0
        {% endif %}

        G91
        G1 E-2.0 F1800
        G1 Z{Z_HOP} F2100
        G90
        M400

        BOX_GO_TO_EXTRUDE_POS
        M400

        # 3. Pulsed Purge Process (chunks <= max_purge_chunk + solidification blast + wipe)
        {% set NUM_CHUNKS = (QTY // MAX_CHUNK)|int + (1 if (QTY % MAX_CHUNK) > 0.001 else 0) %}
        {% set NUM_CHUNKS = 1 if NUM_CHUNKS < 1 else NUM_CHUNKS %}
        {% set CHUNK_LEN = QTY / NUM_CHUNKS %}

        {% for i in range(NUM_CHUNKS) %}
            {action_respond_info("ChromaSave K2 Flush Pulse %d/%d: %.2f mm @ %.0fC" % (i + 1, NUM_CHUNKS, CHUNK_LEN, SAFE_TEMP))}
            {% if has_fan0 %}
                SET_PIN PIN=fan0 VALUE=0
            {% endif %}
            BOX_MATERIAL_FLUSH LEN={CHUNK_LEN|round(2)} VELOCITY={FLUSH_VEL} TEMP={SAFE_TEMP|round(1)}
            M400
            G91
            G1 E-2.0 F1800
            G90
            {% if has_fan0 %}
                SET_PIN PIN=fan0 VALUE={PULSE_COOL_FAN}
            {% endif %}
            G4 P{PULSE_COOL_MS}
            BOX_NOZZLE_CLEAN
            M400
        {% endfor %}

        # 4. Return to safe printable area and restore fan speeds BEFORE returning to tower/part
        BOX_MOVE_TO_SAFE_POS
        M400
        {% if has_fan0 %}
            SET_PIN PIN=fan0 VALUE={fan0_val}
        {% endif %}
        {% if has_fan2 %}
            SET_PIN PIN=fan2 VALUE={fan2_val}
        {% endif %}

        # 5. Restore original state and re-pressurize nozzle
        RESTORE_GCODE_STATE NAME=k2_flush_state MOVE=1 MOVE_SPEED={RETURN_SPEED}
        G91
        M83
        G1 E2.0 F1800
        G90
        G92 E0

    {% else %}
        {action_respond_info("ChromaSave K2 SKIP PURGE: %.2f mm < %.2f mm threshold." % (QTY, SKIP_PURGE))}
    {% endif %}